name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# A newer push to the same branch cancels the older run — PR feedback stays fast
# and we don't burn minutes verifying superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci

      # Order matters: the cheap, fast gates fail first.
      - name: Typecheck
        run: npm run typecheck

      # --max-warnings 0 — the boundaries layering rule is an error, and the
      # codebase is warning-free today. Keep it that way.
      - name: Lint (incl. architecture boundaries)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time only; these are the *publishable* client keys, not secrets
          # in the security sense — but they still live in repo secrets so a fork
          # PR never builds against the real project.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  rls:
    name: RLS policy tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies all migrations from empty onto a throwaway local Postgres, so
      # this job doubles as the migration-replay check the audit asked for
      # (A-M14): a migration that no longer applies cleanly fails here.
      # Only the services the tests touch — the full stack is ~2 min of pull.
      - name: Start local Postgres + auth
        run: supabase start -x studio,realtime,storage-api,imgproxy,edge-runtime,logflare,vector

      # supabase/tests/*.test.sql. These are the assertions that make the
      # authorization model a claim you can check rather than one you make.
      - name: pgTAP
        run: supabase test db

      - name: Stop
        if: always()
        run: supabase stop --no-backup

  audit:
    name: dependency audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Gate on what actually ships. `--omit=dev` is deliberate: the residual
      # advisories in this tree are all in the ESLint toolchain (build-time,
      # never served), and the only "fix" — forcing brace-expansion v5 — breaks
      # minimatch@3 and silently disarms ESLint's file globbing. See the
      # "//overrides" note in package.json.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Visibility without blocking: dev-dependency advisories are reported in
      # the log so they can't rot unnoticed, but they don't fail the build.
      - name: Report dev-dependency advisories (non-blocking)
        if: always()
        run: npm audit --audit-level=high || true

      # The service-role key bypasses RLS entirely. It must never reach a
      # client bundle, and `NEXT_PUBLIC_*` is baked in at build time — so a
      # single careless import ships a full-tenancy bypass to every browser.
      # Cheaper as a grep than as an incident (SRA §5.6.2).
      - name: No service-role key outside the server tier
        run: |
          if grep -rn "SUPABASE_SERVICE_ROLE_KEY\|service_role" \
               src/features src/shared src/app --include=*.ts --include=*.tsx \
             | grep -v "^src/server/"; then
            echo "::error::service-role reference found outside src/server/"
            exit 1
          fi
          echo "clean"

  # ── Deploy ────────────────────────────────────────────────────────────────
  # Before this existed, Vercel built and deployed from the git push on its own,
  # in parallel with and independent of the gate above — so a commit that failed
  # typecheck, tests or the RLS suite still reached production and the whole CI
  # job was advisory (SRA §5.6.3). `needs:` makes it blocking.
  #
  # Requires, in the Vercel project: Ignored Build Step = `exit 0` so Vercel does
  # not also build; and repo secrets VERCEL_TOKEN / VERCEL_ORG_ID /
  # VERCEL_PROJECT_ID / SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID / SUPABASE_DB_PASSWORD.

  migrate:
    name: apply migrations (production)
    needs: [verify, rls, audit]
    # `master`, not just `main`. The `verify` trigger above has always listed
    # both; these two listed only `main`, and this repository's default branch
    # is `master` — so every push ran the full gate, went green, and then
    # silently skipped both the migration and the deploy. A pipeline that is
    # green and does nothing is worse than a red one.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Schema before code, always. Expand-then-contract (add nullable column →
      # deploy code → backfill → constrain) is what makes that ordering safe and
      # keeps an app rollback from requiring a schema rollback.
      - name: Push unapplied migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push

      # `db push` exiting 0 does NOT mean every migration was applied.
      #
      # It compares VERSION TIMESTAMPS against the remote history and applies
      # only what sorts after the newest recorded one. A migration whose
      # filename timestamp is older than the last-applied version — which is
      # what you get the moment anything writes to the remote history out of
      # band (a Studio SQL run, an MCP apply_migration, a hotfix) — is skipped
      # in silence, with a zero exit code.
      #
      # That is not hypothetical. `20260801096000_academic_calendar.sql` and
      # `20260801095000_bulk_import.sql` were both committed, both went green
      # through this pipeline, and neither ever reached the database: nine RPCs
      # missing, the Academic Calendar screen dead, bulk import dead, and
      # `fn_attendance_summary` still counting Eid as a working day. The repo
      # had 64 migration files and the project reported 64 applied migrations,
      # so every count anyone thought to check agreed.
      #
      # `migration list` prints LOCAL and REMOTE columns. A row with a local
      # version and an empty remote one is a migration that did not apply.
      - name: Assert every migration actually applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase migration list > /tmp/migrations.txt
          cat /tmp/migrations.txt
          # Body rows look like `  20260801096000 |                | 2026-08-01`.
          # Local set, remote empty → skipped.
          if awk -F'|' 'NR>2 && $1 ~ /[0-9]{14}/ && $2 !~ /[0-9]{14}/ { print; found=1 }
                        END { exit !found }' /tmp/migrations.txt; then
            echo "::error::the migrations above are in the repo but not in the remote history — db push skipped them (out-of-order version timestamps). Run 'supabase migration repair --status applied <version>' or re-stamp the file."
            exit 1
          fi
          echo "every local migration is recorded remotely"

  deploy:
    name: deploy (production)
    needs: [migrate]
    # `master`, not just `main`. The `verify` trigger above has always listed
    # both; these two listed only `main`, and this repository's default branch
    # is `master` — so every push ran the full gate, went green, and then
    # silently skipped both the migration and the deploy. A pipeline that is
    # green and does nothing is worse than a red one.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Build once, here, gated — then upload the prebuilt output. Vercel keeps
      # hosting, CDN, atomic swap, instant rollback and preview URLs.
      - run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Post-deploy proof, not hope: /api/health echoes the commit it was built
      # from, so a stale or failed swap fails the pipeline instead of sitting
      # quietly in production.
      - name: Smoke — /api/health reports this commit
        if: vars.PRODUCTION_URL != ''
        run: |
          sleep 10
          body=$(curl -fsS "${{ vars.PRODUCTION_URL }}/api/health")
          echo "$body"
          echo "$body" | grep -q "$GITHUB_SHA" || {
            echo "::error::/api/health did not report $GITHUB_SHA"; exit 1; }
